/* ── Toast ── */
function useToast() {
  const [toast, setToast] = useState(null);
  const timer = useRef(null);
  const show = useCallback((message, tone = 'success') => {
    clearTimeout(timer.current);
    setToast({ message, tone });
    timer.current = setTimeout(() => setToast(null), 3500);
  }, []);
  return [toast, show];
}

function Toast({ toast }) {
  if (!toast) return null;
  const tone = toast.tone === 'error' ? 'border-danger/40 text-danger' : 'border-gold/40 text-olive-pale';
  return html`
    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[999] anim-pop" role="status" aria-live="polite">
      <div class=${`bg-charcoal border ${tone} px-6 py-3 text-sm font-serif italic shadow-xl shadow-black/20`}>
        ${toast.message}
      </div>
    </div>`;
}

/* ── Modal shell ── */
function Modal({ open, onClose, children, labelledBy }) {
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open, onClose]);
  if (!open) return null;
  return html`
    <div class="fixed inset-0 z-[1000] flex items-center justify-center bg-deep/70 backdrop-blur-sm p-4 anim-pop"
         role="dialog" aria-modal="true" aria-labelledby=${labelledBy}
         onMouseDown=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
      ${children}
    </div>`;
}

/* ── Login ── */

  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  const submit = async (e) => {
    e.preventDefault();
    setErr(''); setBusy(true);
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
    setBusy(false);
    if (error) { setErr(error.message); return; }
    onSignedIn();

  return html`
    <div class="min-h-screen flex items-center justify-center px-4"
         style=${{ background: 'radial-gradient(ellipse at 40% 35%, #3a3e18, #0e0c04 70%)' }}>

        </div>

        <div class="flex flex-col gap-1.5 mb-2 text-left">
          <label for="admin-pass" class="text-[.54rem] tracking-[.24em] uppercase text-olive-pale/50">Password</label>
          <div class="relative">

            </button>

/* ── Change Password Modal ── */
function PasswordModal({ open, onClose, notify }) {
  const [pw, setPw] = useState('');
  const [confirm, setConfirm] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const firstRef = useRef(null);

  useEffect(() => {
    if (open) { setPw(''); setConfirm(''); setErr(''); setTimeout(() => firstRef.current?.focus(), 50); }
  }, [open]);

  const submit = async (e) => {
    e.preventDefault();
    setErr('');
    if (pw.length < 8) { setErr('Password must be at least 8 characters.'); return; }
    if (pw !== confirm) { setErr('Passwords do not match.'); return; }
    setBusy(true);
    const { error } = await sb.auth.updateUser({ password: pw });
    setBusy(false);
    if (error) { setErr(error.message); return; }
    onClose();
    notify('Password updated.');
  };

  return html`
    <${Modal} open=${open} onClose=${onClose} labelledBy="pw-modal-title">
      <form onSubmit=${submit} class="anim-pop bg-charcoal border border-gold/20 p-9 max-w-sm w-full">
        <div id="pw-modal-title" class="font-serif italic text-2xl text-olive-pale mb-6">Change Password</div>
        <div class="flex flex-col gap-1.5 mb-4 text-left">
          <label for="pw-new" class="text-[.54rem] tracking-[.24em] uppercase text-olive-pale/50">New Password</label>
          <input ref=${firstRef} id="pw-new" type="password" autoComplete="new-password"
                 value=${pw} onInput=${(e) => setPw(e.target.value)}
                 placeholder="At least 8 characters"
                 class="bg-transparent border-0 border-b border-gold/30 py-2 font-serif text-base text-cream placeholder:text-olive-pale/20 placeholder:italic outline-none focus:border-gold transition-colors"/>
        </div>
        <div class="flex flex-col gap-1.5 mb-2 text-left">
          <label for="pw-confirm" class="text-[.54rem] tracking-[.24em] uppercase text-olive-pale/50">Confirm Password</label>
          <input id="pw-confirm" type="password" autoComplete="new-password"
                 value=${confirm} onInput=${(e) => setConfirm(e.target.value)}
                 placeholder="••••••••"
                 class="bg-transparent border-0 border-b border-gold/30 py-2 font-serif text-base text-cream placeholder:text-olive-pale/20 placeholder:italic outline-none focus:border-gold transition-colors"/>
        </div>
        <div class="min-h-[18px] text-[.7rem] text-danger/80 font-serif italic mt-2" role="alert">${err}</div>
        <div class="flex gap-2.5 mt-6">
          <button type="button" onClick=${onClose}
                  class="flex-1 py-3 border border-olive-pale/20 text-olive-pale/60 text-[.56rem] tracking-[.2em] uppercase cursor-pointer hover:border-olive-pale/40 transition-colors">Cancel</button>
          <button type="submit" disabled=${busy}
                  class="flex-1 py-3 bg-olive-dk text-ivory text-[.56rem] tracking-[.2em] uppercase cursor-pointer hover:bg-olive transition-colors disabled:opacity-50">
            ${busy ? 'Updating…' : 'Update'}

        </div>
      </form>
    <//>`;
}

function StatsGrid({ rsvps }) {
  const yes = rsvps.filter((r) => r.attending === 'yes');
  const no = rsvps.filter((r) => r.attending === 'no');
  const totalGuests = yes.reduce((sum, r) => sum + (r.guests || 1), 0);
  return html`
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-9">
      <${StatCard} label="Total RSVPs" value=${rsvps.length} accent="bg-gold" delay=${0}/>
      <${StatCard} label="Attending" value=${yes.length} accent="bg-success" delay=${40}/>
      <${StatCard} label="Declining" value=${no.length} accent="bg-danger" delay=${80}/>
      <${StatCard} label="Total Guests" value=${totalGuests} accent="bg-olive" delay=${120}/>
    </div>`;
}

function MealBreakdown({ rsvps }) {
  const attending = rsvps.filter((r) => r.attending === 'yes');
  const count = (k) => attending.filter((r) => (r.meal_preference || 'No preference').toLowerCase() === k.toLowerCase()).length;
  const meals = [
    ['No Preference', count('No preference')],
    ['Vegetarian', count('Vegetarian')],
    ['Vegan', count('Vegan')],
    ['Gluten-Free', count('Gluten-free')],
  ];
  return html`
    <div class="mb-9">
      <div class="font-serif text-xl font-light text-ink mb-4 pb-2.5 border-b border-olive/15">Meal Preferences</div>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        ${meals.map(([label, num], i) => html`
          <div key=${label} class="anim-in bg-white border border-olive/10 p-4 text-center" style=${{ animationDelay: `${i * 30}ms` }}>
            <div class="font-serif text-3xl text-olive-dk tabular-nums">${num}</div>
            <div class="text-[.52rem] tracking-[.2em] uppercase text-muted mt-1">${label}</div>
          </div>`)}
      </div>
    </div>`;
}

/* ── Guest Table ── */
function GuestTable({ rsvps, loading, onDelete, notify }) {
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('all');
  const [sortKey, setSortKey] = useState('created_at');
  const [sortDir, setSortDir] = useState('desc');
  const [confirmTarget, setConfirmTarget] = useState(null);
  const [deleting, setDeleting] = useState(false);
  const [expanded, setExpanded] = useState(() => new Set());

  const toggleExpanded = (id) => setExpanded((prev) => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });

  const onSort = (key) => {
    if (key === sortKey) setSortDir((d) => (d === 'asc' ? 'desc' : 'asc'));
    else { setSortKey(key); setSortDir('asc'); }
  };

  const filtered = useMemo(() => {
    let data = filter === 'all' ? rsvps : rsvps.filter((r) => r.attending === filter);
    const q = search.trim().toLowerCase();
    if (q) data = data.filter((r) => `${r.first_name} ${r.last_name} ${r.email}`.toLowerCase().includes(q));
    const dir = sortDir === 'asc' ? 1 : -1;
    return [...data].sort((a, b) => {
      if (sortKey === 'name') return dir * `${a.first_name} ${a.last_name || ''}`.localeCompare(`${b.first_name} ${b.last_name || ''}`);
      if (sortKey === 'guests') return dir * ((a.guests || 1) - (b.guests || 1));
      return dir * (new Date(a.created_at) - new Date(b.created_at));
    });
  }, [rsvps, filter, search, sortKey, sortDir]);

  const exportCSV = () => {
    if (!rsvps.length) { notify('No data to export.', 'error'); return; }
    const cols = ['first_name', 'last_name', 'email', 'attending', 'guests', 'meal_preference', 'message', 'created_at'];
    const header = cols.join(',');
    const rows = rsvps.map((r) => cols.map((c) => `"${String(r[c] ?? '').replace(/"/g, '""')}"`).join(','));
    const csv = [header, ...rows].join('\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    a.download = `chelsea-gabriel-rsvps-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    notify('CSV exported!');
  };

  const confirmDelete = async () => {
    setDeleting(true);
    await onDelete(confirmTarget.id);
    setDeleting(false);
    setConfirmTarget(null);
  };

  const esc = (s) => String(s ?? '');

  return html`
    <div>
      <div class="font-serif text-xl font-light text-ink mb-4 pb-2.5 border-b border-olive/15">Guest List</div>
      <div class="bg-white border border-olive/15">
        <div class="p-4 flex flex-wrap items-center gap-2.5 border-b border-olive/10">
          <div class="relative">
            <${Icon} path=${paths.search} className="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-muted pointer-events-none" strokeWidth=${2}/>
            <input type="text" value=${search} onInput=${(e) => setSearch(e.target.value)}
                   placeholder="Search by name or email…"
                   class="border border-olive/20 bg-cream pl-8 pr-3 py-2 font-serif text-sm text-ink outline-none min-w-[220px] focus:border-olive transition-colors placeholder:text-muted/70"/>
          </div>
          ${['all', 'yes', 'no'].map((f) => html`
            <button key=${f} onClick=${() => setFilter(f)}
                    class=${`px-4 py-2 border text-[.52rem] tracking-[.2em] uppercase cursor-pointer transition-colors ${filter === f ? 'bg-olive text-white border-olive' : 'border-olive/20 text-muted hover:border-olive/40'}`}>
              ${f === 'all' ? 'All' : f === 'yes' ? 'Attending' : 'Declining'}
            </button>`)}
          <div class="ml-auto flex gap-2">
            <button onClick=${exportCSV} title="Export CSV"
                    class="flex items-center gap-1.5 px-4 py-2 bg-olive-dk text-ivory text-[.52rem] tracking-[.2em] uppercase cursor-pointer hover:bg-olive transition-colors">
              <${Icon} path=${paths.download} className="w-3 h-3" strokeWidth=${2}/> Export
            </button>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full border-collapse min-w-[820px]">
            <thead class="bg-charcoal">
              <tr>
                <${Th} label="#"/>
                <${Th} label="Name" sortKey="name" active=${sortKey === 'name'} dir=${sortDir} onSort=${onSort}/>
                <${Th} label="Email"/>
                <${Th} label="Attending"/>
                <${Th} label="Guests" sortKey="guests" active=${sortKey === 'guests'} dir=${sortDir} onSort=${onSort} className="text-center"/>
                <${Th} label="Meal"/>
                <${Th} label="Message"/>
                <${Th} label="Date" sortKey="created_at" active=${sortKey === 'created_at'} dir=${sortDir} onSort=${onSort}/>
                <${Th} label=""/>
              </tr>
            </thead>
            <tbody>
              ${loading ? html`<${SkeletonRows}/>` : filtered.length === 0 ? html`
                <tr>
                  <td colSpan="9" class="py-16 text-center">
                    <div class="flex flex-col items-center gap-2 text-muted">
                      <${Icon} path=${paths.inbox} className="w-8 h-8 text-olive/30" strokeWidth=${1.3}/>
                      <span class="font-serif italic text-lg">${rsvps.length === 0 ? 'No RSVPs yet — share the invitation!' : 'No guests match your search.'}</span>
                    </div>
                  </td>
                </tr>` : filtered.map((r, i) => html`
                <tr key=${r.id} class="border-b border-olive/8 last:border-0 hover:bg-olive/[.03] transition-colors">
                  <td class="px-3 py-3 text-[.72rem] text-muted tabular-nums">${i + 1}</td>
                  <td class="px-3 py-3 text-sm"><strong class="font-medium">${esc(r.first_name)}</strong> ${esc(r.last_name)}</td>
                  <td class="px-3 py-3 text-sm text-muted">${esc(r.email)}</td>
                  <td class="px-3 py-3">
                    <span class=${`inline-flex items-center gap-1 px-2.5 py-1 text-[.5rem] tracking-[.15em] uppercase rounded-sm ${r.attending === 'yes' ? 'bg-success/10 text-success' : 'bg-danger/10 text-danger'}`}>
                      ${r.attending === 'yes' ? 'Attending' : 'Declining'}
                    </span>
                  </td>
                  <td class="px-3 py-3 text-center text-sm tabular-nums">${r.attending === 'yes' ? r.guests : '—'}</td>
                  <td class="px-3 py-3 text-[.76rem] text-muted">${esc(r.meal_preference || '—')}</td>
                  <td class=${`px-3 py-3 font-serif italic text-[.78rem] text-muted ${expanded.has(r.id) ? 'max-w-[280px] whitespace-normal' : 'max-w-[160px] truncate whitespace-nowrap'} ${r.message ? 'cursor-pointer hover:text-ink transition-colors' : ''}`}
                      onClick=${() => r.message && toggleExpanded(r.id)}
                      title=${r.message && !expanded.has(r.id) ? 'Click to read full message' : ''}>
                    ${esc(r.message || '—')}
                  </td>
                  <td class="px-3 py-3 text-[.72rem] text-muted whitespace-nowrap">${new Date(r.created_at).toLocaleDateString('en-GB')}</td>
                  <td class="px-3 py-3">
                    <button onClick=${() => setConfirmTarget(r)} aria-label=${`Remove ${r.first_name}`}
                            class="p-1.5 text-danger/40 hover:text-danger transition-colors cursor-pointer focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-danger rounded">
                      <${Icon} path=${paths.trash} className="w-3.5 h-3.5" strokeWidth=${1.75}/>
                    </button>
                  </td>
                </tr>`)}
            </tbody>
          </table>
        </div>
      </div>

      <${ConfirmDeleteModal} guest=${confirmTarget} busy=${deleting}
        onClose=${() => setConfirmTarget(null)} onConfirm=${confirmDelete}/>
    </div>`;
}

/* ── Dashboard ── */
function Dashboard({ onSignOut, notify }) {
  const [rsvps, setRsvps] = useState([]);
  const [loading, setLoading] = useState(true);
  const [pwOpen, setPwOpen] = useState(false);
  const [refreshing, setRefreshing] = useState(false);

  const load = useCallback(async (isRefresh) => {
    if (isRefresh) setRefreshing(true); else setLoading(true);
    const { data, error } = await sb.from('rsvps').select('*').order('created_at', { ascending: false });
    if (error) notify('Failed to load data: ' + error.message, 'error');
    else setRsvps(data || []);
    setLoading(false); setRefreshing(false);
  }, [notify]);

  useEffect(() => { load(false); }, [load]);

  const handleDelete = async (id) => {
    const { error } = await sb.from('rsvps').delete().eq('id', id);
    if (error) { notify('Delete failed: ' + error.message, 'error'); return; }
    setRsvps((prev) => prev.filter((r) => r.id !== id));
    notify('RSVP removed.');
  };

  const dateStr = new Date().toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  return html`
    <div class="min-h-screen">
      <header class="bg-charcoal px-5 sm:px-9 py-5 flex flex-wrap items-center justify-between gap-3 border-b border-gold/10">
        <div>
          <div class="font-serif italic text-2xl text-olive-pale">Chelsea & Gabriel · Enugu 2027</div>
          <div class="text-[.5rem] tracking-[.24em] uppercase text-olive-pale/35 mt-0.5">RSVP Management</div>
        </div>
        <div class="flex items-center gap-2 sm:gap-4">
          <span class="hidden md:inline text-[.52rem] tracking-[.16em] text-olive-pale/30">${dateStr}</span>
          <button onClick=${() => load(true)} aria-label="Refresh data" title="Refresh"
                  class="p-2 border border-olive-pale/20 text-olive-pale/50 hover:text-gold hover:border-gold/40 transition-colors cursor-pointer">
            <${Icon} path=${paths.refresh} className=${`w-3.5 h-3.5 ${refreshing ? 'animate-spin' : ''}`} strokeWidth=${2}/>
          </button>
          <button onClick=${() => setPwOpen(true)}
                  class="flex items-center gap-1.5 px-4 py-2 border border-olive-pale/20 text-olive-pale/50 text-[.52rem] tracking-[.22em] uppercase cursor-pointer hover:border-gold/40 hover:text-gold transition-colors">
            <${Icon} path=${paths.key} className="w-3 h-3" strokeWidth=${2}/>
            <span class="hidden sm:inline">Change Password</span>
          </button>
          <button onClick=${onSignOut}
                  class="flex items-center gap-1.5 px-4 py-2 border border-olive-pale/20 text-olive-pale/50 text-[.52rem] tracking-[.22em] uppercase cursor-pointer hover:border-danger/50 hover:text-danger/80 transition-colors">
            <${Icon} path=${paths.logout} className="w-3 h-3" strokeWidth=${2}/>
            <span class="hidden sm:inline">Sign Out</span>
          </button>
        </div>
      </header>

      <main class="p-5 sm:p-9 max-w-[1440px] mx-auto">
        <${StatsGrid} rsvps=${rsvps}/>
        <${MealBreakdown} rsvps=${rsvps}/>
        <${GuestTable} rsvps=${rsvps} loading=${loading} onDelete=${handleDelete} notify=${notify}/>
      </main>

      <${PasswordModal} open=${pwOpen} onClose=${() => setPwOpen(false)} notify=${notify}/>
    </div>`;
}

/* ── Root App ── */
function App() {
  const [session, setSession] = useState(undefined); // undefined = checking, null = signed out
  const [toast, notify] = useToast();

  useEffect(() => {
    sb.auth.getSession().then(({ data: { session } }) => setSession(session));
    const { data: sub } = sb.auth.onAuthStateChange((_event, session) => setSession(session));
    return () => sub.subscription.unsubscribe();
  }, []);

  const signOut = async () => { await sb.auth.signOut(); setSession(null); };

  if (session === undefined) {
    return html`<div class="min-h-screen flex items-center justify-center"><div class="skeleton w-40 h-6 rounded"></div></div>`;
  }

  return html`
    <div>
      ${session ? html`<${Dashboard} onSignOut=${signOut} notify=${notify}/>` : html`<${Login} onSignedIn=${() => {}}/>`}
      <${Toast} toast=${toast}/>
    </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
